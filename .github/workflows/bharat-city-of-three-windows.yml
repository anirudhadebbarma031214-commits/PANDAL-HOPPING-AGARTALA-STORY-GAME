name: Build BHARAT City of Three (Windows)
on:
  workflow_dispatch:
  push:
    paths:
      - 'BHARAT-CITY-OF-THREE/**'
      - '.github/workflows/bharat-city-of-three-windows.yml'

jobs:
  build-windows:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Export Windows game with Godot 4.3
        run: |
          mkdir -p BHARAT-CITY-OF-THREE/project/build
          docker run --rm             -v "$PWD/BHARAT-CITY-OF-THREE/project:/project"             barichello/godot-ci:4.3             godot --headless --path /project --export-release "Windows Desktop" /project/build/BHARAT_CITY_OF_THREE.exe

      - name: Package playable Windows build
        run: |
          cd BHARAT-CITY-OF-THREE/project/build
          zip -q BHARAT_CITY_OF_THREE_Windows.zip BHARAT_CITY_OF_THREE.exe

      - name: Upload playable build
        uses: actions/upload-artifact@v4
        with:
          name: BHARAT-CITY-OF-THREE-Windows
          path: BHARAT-CITY-OF-THREE/project/build/BHARAT_CITY_OF_THREE_Windows.zip
          if-no-files-found: error
          retention-days: 14
