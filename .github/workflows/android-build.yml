name: Build Pandal Hopping Android
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          SDK="/usr/local/lib/android/sdk"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find /opt/android-sdk /usr/lib/android-sdk "$HOME" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager was not found on this GitHub runner"
            find /usr/local/lib/android/sdk /opt/android-sdk /usr/lib/android-sdk -maxdepth 5 -type f -name sdkmanager -print 2>/dev/null || true
            exit 1
          fi
          SDKMANAGER_DIR="$(dirname "$SDKMANAGER")"
          echo "$SDKMANAGER_DIR" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "Using sdkmanager: $SDKMANAGER"
          "$SDKMANAGER" --sdk_root="$SDK" "platform-tools" "platforms;android-35" "build-tools;35.0.1" "ndk;28.1.13356709" "cmake;3.10.2.4988404"
          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses || true
          "$SDK/platform-tools/adb" version

      - name: Godot
        run: |
          mkdir -p "$HOME/godot"
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip -O "$HOME/godot/godot.zip"
          unzip -q "$HOME/godot/godot.zip" -d "$HOME/godot"
          chmod +x "$HOME/godot/Godot_v4.5.1-stable_linux.x86_64"

          mkdir -p "$HOME/.local/share/godot/export_templates/4.5.1.stable"
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.5.1-stable/Godot_v4.5.1-stable_export_templates.tpz -O "$HOME/godot_templates.tpz"
          unzip -q -j "$HOME/godot_templates.tpz" -d "$HOME/.local/share/godot/export_templates/4.5.1.stable"
          echo "4.5.1.stable" > "$HOME/.local/share/godot/export_templates/4.5.1.stable/version.txt"
          ls -lh "$HOME/.local/share/godot/export_templates/4.5.1.stable"

      - name: Configure Godot Android paths
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]

          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
          cat "$HOME/.config/godot/editor_settings-4.tres"

      - name: Signing
        run: |
          mkdir -p "$HOME/.android"
          rm -f "$HOME/.android/debug.keystore"
          keytool -genkeypair             -keystore "$HOME/.android/debug.keystore"             -storepass android             -alias androiddebugkey             -keypass android             -keyalg RSA             -keysize 2048             -validity 10000             -dname "CN=Android Debug,O=Android,C=US"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Validate project and Android export setup
        run: |
          "$HOME/godot/Godot_v4.5.1-stable_linux.x86_64" --headless --path "$GITHUB_WORKSPACE" --editor --quit
          "$HOME/godot/Godot_v4.5.1-stable_linux.x86_64" --headless --path "$GITHUB_WORKSPACE" --export-debug "Android" "$GITHUB_WORKSPACE/build-test.apk"

      - name: Export APK
        run: |
          mkdir -p build
          rm -f build/PandalHopping.apk
          "$HOME/godot/Godot_v4.5.1-stable_linux.x86_64" --headless --path "$GITHUB_WORKSPACE" --export-debug "Android" "$GITHUB_WORKSPACE/build/PandalHopping.apk"

      - name: Verify
        run: |
          test -s build/PandalHopping.apk
          file build/PandalHopping.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Pandal-Hopping-Android
          path: build/PandalHopping.apk
          if-no-files-found: error
