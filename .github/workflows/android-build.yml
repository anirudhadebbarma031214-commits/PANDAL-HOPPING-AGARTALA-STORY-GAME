name: Source Check (manual only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-check:
    name: Lightweight source check (no Android build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Check essential project files
        run: |
          test -f project.godot
          test -f main.tscn
          test -f main.gd
          test -f game_state.gd
          test -f story_director.gd
          echo "Essential source files are present. No APK was built."
