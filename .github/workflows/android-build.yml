name: Build Pandal Hopping Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Export Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout game
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;23.2.8568313"
          yes | sdkmanager --licenses

      - name: Download Godot 4.3 and export templates
        shell: bash
        run: |
          set -euo pipefail
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.3-stable_linux.x86_64
          echo "/tmp/godot" >> "$GITHUB_PATH"

          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz -O /tmp/templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          unzip -q /tmp/templates.tpz -d /tmp/templates
          if [ -d /tmp/templates/templates ]; then
            cp -a /tmp/templates/templates/. "$HOME/.local/share/godot/export_templates/4.3.stable/"
          else
            cp -a /tmp/templates/. "$HOME/.local/share/godot/export_templates/4.3.stable/"
          fi

      - name: Import project resources
        run: Godot_v4.3-stable_linux.x86_64 --headless --editor --path . --quit

      - name: Export debug APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          Godot_v4.3-stable_linux.x86_64 --headless --path . --export-debug "Android" build/PandalHopping.apk
          test -s build/PandalHopping.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Pandal-Hopping-Android-APK
          path: build/PandalHopping.apk
          if-no-files-found: error
          retention-days: 14
