name: Build Pandal Hopping Android

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses || true

      - name: Download Godot 4.5.1
        run: |
          mkdir -p "$HOME/godot"
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip -O "$HOME/godot/godot.zip"
          unzip -q "$HOME/godot/godot.zip" -d "$HOME/godot"
          chmod +x "$HOME/godot/Godot_v4.5.1-stable_linux.x86_64"

      - name: Install Godot export templates
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/4.5.1.stable"
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.5.1-stable/Godot_v4.5.1-stable_export_templates.tpz -O "$HOME/godot_templates.tpz"
          unzip -q -j "$HOME/godot_templates.tpz" -d "$HOME/.local/share/godot/export_templates/4.5.1.stable"

      - name: Configure Android signing
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v             -keystore "$HOME/.android/debug.keystore"             -storepass android             -alias androiddebugkey             -keypass android             -keyalg RSA             -keysize 2048             -validity 10000             -dname "CN=Android Debug,O=Android,C=US"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Import Godot project
        run: |
          "$HOME/godot/Godot_v4.5.1-stable_linux.x86_64"             --headless             --path "$GITHUB_WORKSPACE"             --import             --quit

      - name: Validate Android export preset
        run: |
          test -f "$GITHUB_WORKSPACE/project.godot"
          test -f "$GITHUB_WORKSPACE/export_presets.cfg"
          test -f "$GITHUB_WORKSPACE/main.tscn"
          test -f "$GITHUB_WORKSPACE/main.gd"
          echo "Project files:"
          ls -la "$GITHUB_WORKSPACE"
          echo "Android preset:"
          sed -n '1,220p' "$GITHUB_WORKSPACE/export_presets.cfg"

      - name: Export Android APK
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build"
          "$HOME/godot/Godot_v4.5.1-stable_linux.x86_64"             --headless             --path "$GITHUB_WORKSPACE"             --export-debug "Android"             "$GITHUB_WORKSPACE/build/PandalHopping.apk"

      - name: Verify APK
        run: |
          test -s "$GITHUB_WORKSPACE/build/PandalHopping.apk"
          ls -lh "$GITHUB_WORKSPACE/build/PandalHopping.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Pandal-Hopping-Android
          path: build/PandalHopping.apk
          if-no-files-found: error
