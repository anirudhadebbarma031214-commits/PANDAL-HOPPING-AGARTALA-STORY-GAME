name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create Godot Directory
        run: mkdir -p $HOME/godot

      - name: Download Godot 4.3 Engine
        run: |
          curl -L -o godot.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip godot.zip
          mv Godot_v4.3-stable_linux.x86_64 $HOME/godot/godot
          chmod +x $HOME/godot/godot
          echo "$HOME/godot" >> $GITHUB_PATH

      - name: Download Godot 4.3 Export Templates
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          curl -L -o templates.tpz https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          unzip templates.tpz -d /tmp/templates
          mv /tmp/templates/templates/* "$HOME/.local/share/godot/export_templates/4.3.stable/"
          rm -rf /tmp/templates templates.tpz godot.zip

      - name: Import Godot Project Assets
        run: godot --headless --path "$GITHUB_WORKSPACE" --editor --quit

      - name: Start ADB Server
        run: adb start-server

      # --- FIX FOR TARGET FOLDER ERROR ---
      - name: Create Build Output Directory
        run: mkdir -p "$GITHUB_WORKSPACE/build"

      - name: Export Android Debug APK
        run: godot --headless --path "$GITHUB_WORKSPACE" --export-debug "Android" "$GITHUB_WORKSPACE/build/PandalHopping.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PandalHopping-Android-APK
          path: build/PandalHopping.apk
